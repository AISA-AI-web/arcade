<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pD-Day 2026 · AISA</title>
<meta name="description" content="pD-Day 2026: explore the school with Leo the lion, complete AI quests at each PD station and earn badges. In English and Arabic.">
<meta name="theme-color" content="#21076C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..1000&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game/styles.css">
</head>
<body>
<canvas id="game" aria-label="The school: walk around to find the quests"></canvas>
<div id="vignette" aria-hidden="true"></div>

<div id="hud" hidden></div>
<canvas id="minimap" hidden title="Map"></canvas>
<button id="prompt" type="button"></button>
<div id="banner" aria-live="polite"></div>
<div id="bubble" aria-live="polite"></div>
<div id="toasts" aria-live="polite"></div>

<div id="dialog" hidden>
  <div class="dlg-card">
    <div class="dlg-portrait"></div>
    <div class="dlg-body">
      <div class="dlg-name"></div>
      <div class="dlg-text"></div>
      <div class="dlg-actions">
        <button class="dlg-skip" type="button"></button>
        <button class="dlg-next" type="button"></button>
      </div>
    </div>
  </div>
</div>

<div id="screen-title" class="screen"></div>
<div id="screen-setup" class="screen" hidden></div>

<div id="modal" hidden><div class="modal-card" tabindex="-1" role="dialog" aria-modal="true"></div></div>
<div id="award" hidden role="dialog" aria-modal="true"></div>
<div id="lightbox" hidden></div>
<div id="cert" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<noscript><div class="noscript">pD-Day 2026 needs JavaScript. You can still use the <a href="stations.html">station guides</a>.</div></noscript>

<script src="game/content.js"></script>
<script src="game/art.js"></script>
<script src="game/world.js"></script>
<script src="game/game.js"></script>
</body>
</html>
